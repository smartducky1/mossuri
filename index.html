<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>MOSSURI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Skranji:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="/styles.css">
</head>

<body>

  <main class="task-page">

    <!-- CHARACTER SELECTOR -->
    <section class="character-carousel">

      <button
        type="button"
        id="prevChar"
        aria-label="Previous personality"
      >
        ◀
      </button>

      <div class="character-window">
        <img
          id="selectorImage"
          src="/assets/goofy.jpg"
          alt="Goofy personality"
        >
      </div>

      <button
        type="button"
        id="nextChar"
        aria-label="Next personality"
      >
        ▶
      </button>

    </section>


    <!-- WALLET CHECKER -->
    <section class="status-area">

      <div class="status-check">

        

        <input
          id="checkWallet"
          type="text"
          autocomplete="off"
          placeholder="Paste EVM"
          aria-label="Paste EVM wallet"
        >

        <button
          type="button"
          id="checkBtn"
        >
          CHECK
        </button>

      </div>

      <div
        id="checkResult"
        class="status-result"
        aria-live="polite"
      ></div>

    </section>


    <!-- WHITELIST TASKS -->
    <section class="task-card">

      <form id="applicationForm" novalidate>

        <!-- FOLLOW X -->
        <div class="task-row">

          <label for="username">
            FOLLOW X
          </label>

          <div class="dark-row">

            <input
              id="username"
              type="text"
              autocomplete="off"
              placeholder="Drop your X username"
            >

            <a
              href="https://x.com/mossuris"
              target="_blank"
              rel="noopener noreferrer"
            >
              FOLLOW
            </a>

          </div>

        </div>


        <!-- LIKE + RT -->
        <div class="task-row">

          <label>
            LIKE &amp; RT PINNED POST
          </label>

          <div class="dark-row single">

            <a
              href="https://x.com/mossuris"
              target="_blank"
              rel="noopener noreferrer"
            >
              GO TO X
            </a>

          </div>

        </div>


        <!-- QUOTE TWEET -->
        <div class="task-row">

          <label for="quoteUrl">
            QT PINNED POST WITH YOUR SELECTED CHARACTER
          </label>

          <div class="dark-row">

            <input
              id="quoteUrl"
              type="url"
              autocomplete="off"
              placeholder="Link to QT https://x.com/status..."
            >

          </div>

        </div>


        <!-- TAG 3 FRIENDS -->
        <div class="task-row">

          <label for="tagUrl">
            TAG 3 FRIENDS IN PINNED POST COMMENT
          </label>

          <div class="dark-row">

            <input
              id="tagUrl"
              type="url"
              autocomplete="off"
              placeholder="Link to comment https://x.com/status..."
            >

          </div>

        </div>


        <!-- WALLET -->
        <div class="task-row">

          <label for="wallet">
            SUBMIT EVM WALLET
          </label>

          <div class="dark-row">

            <input
              id="wallet"
              type="text"
              autocomplete="off"
              placeholder="0x..."
            >

          </div>

        </div>


        <div
          id="serverError"
          class="server-error"
          aria-live="polite"
        ></div>


        <button
          type="submit"
          class="register"
          id="registerBtn"
        >
          REGISTER
        </button>

      </form>

    </section>


    <!-- SELECTED PERSONALITY -->
    <section class="personality-card">

      <img
        id="personalityImage"
        src="/assets/goofy.jpg"
        alt="Goofy personality"
      >

      <div>

        <span>Personality</span>

        <strong id="personalityName">
          Goofy
        </strong>

      </div>

      <button
        type="button"
        id="downloadBtn"
        aria-label="Download selected character"
      >
        ⇩
      </button>

    </section>


    <!-- MOSSURIS BOARD -->
    <section class="leaderboard">

      <h2>Mossuris Board</h2>

      <div class="table">

        <div class="thead">

          <span>Username</span>
          <span>Wallet</span>
          <span>Personality</span>

        </div>

        <div
          id="boardRows"
          class="tbody"
        ></div>

      </div>

      <div class="scroll-buttons">

        <button
          type="button"
          id="boardUp"
          aria-label="Scroll board up"
        >
          ▲
        </button>

        <button
          type="button"
          id="boardDown"
          aria-label="Scroll board down"
        >
          ▼
        </button>

      </div>

    </section>

  </main>


  <!-- TOAST -->
  <div
    id="toast"
    class="toast"
    role="status"
  ></div>


  <!-- SUCCESS POPUP -->
  <div
    id="successOverlay"
    class="success-overlay"
    hidden
  >

    <div
      class="success-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="successTitle"
    >

      <button
        type="button"
        class="close"
        id="closeSuccess"
        aria-label="Close"
      >
        ×
      </button>

      <img
        id="successImage"
        src="/assets/success-popup.png"
        alt="Mossuri success"
      >

      <h2 id="successTitle">
        Application received
      </h2>

      <p>
        You're on the list!
      </p>

    </div>

  </div>


  <script src="/script.js"></script>

</body>
</html>
