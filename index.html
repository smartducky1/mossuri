<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>MOSSURI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Skranji:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="/styles.css">
</head>

<body>

  <main class="task-page">

    <!-- =========================================
         CHARACTER CAROUSEL
    ========================================== -->

    <section class="character-carousel">

      <button
        class="character-arrow character-arrow-left"
        id="prevCharacter"
        type="button"
        aria-label="Previous personality"
      >
        ‹
      </button>

      <div class="character-frame">
        <img
          id="characterImage"
          src="/assets/goofy.jpg"
          alt="Goofy personality"
        >
      </div>

      <button
        class="character-arrow character-arrow-right"
        id="nextCharacter"
        type="button"
        aria-label="Next personality"
      >
        ›
      </button>

    </section>


    <!-- =========================================
         EVM CHECKER
    ========================================== -->

    <section class="checker">

      <input
        type="text"
        id="checkWallet"
        placeholder="Paste EVM"
        autocomplete="off"
        aria-label="Paste EVM wallet"
      >

      <button
        id="checkBtn"
        type="button"
      >
        CHECK
      </button>

      <div
        id="checkResult"
        class="check-result"
        aria-live="polite"
      ></div>

    </section>


    <!-- =========================================
         WHITELIST TASK CARD
    ========================================== -->

    <section class="task-card">

      <h1 class="task-title">
        MOSSURI
      </h1>

      <p class="task-subtitle">
        Complete the tasks below
      </p>


      <!-- Follow X -->

      <div class="task-row">

        <div class="task-label">
          Follow X
        </div>

        <a
          class="task-action"
          href="https://x.com/mossuris"
          target="_blank"
          rel="noopener noreferrer"
        >
          Follow @mossuris
        </a>

      </div>


      <!-- Like & RT -->

      <div class="task-row">

        <div class="task-label">
          Like &amp; RT
        </div>

        <a
          class="task-action"
          href="https://x.com/mossuris"
          target="_blank"
          rel="noopener noreferrer"
        >
          Go to X
        </a>

      </div>


      <!-- Quote -->

      <div class="task-row task-input-row">

        <label
          class="task-label"
          for="quoteUrl"
        >
          Quote Tweet
        </label>

        <input
          id="quoteUrl"
          type="url"
          placeholder="Paste quote tweet link"
          autocomplete="off"
        >

      </div>


      <!-- Tag -->

      <div class="task-row task-input-row">

        <label
          class="task-label"
          for="tagUrl"
        >
          Tag 3 Friends
        </label>

        <input
          id="tagUrl"
          type="url"
          placeholder="Paste post link"
          autocomplete="off"
        >

      </div>


      <!-- Username -->

      <div class="task-row task-input-row">

        <label
          class="task-label"
          for="username"
        >
          X Username
        </label>

        <input
          id="username"
          type="text"
          placeholder="@username"
          autocomplete="off"
        >

      </div>


      <!-- Wallet -->

      <div class="task-row task-input-row">

        <label
          class="task-label"
          for="wallet"
        >
          EVM Wallet
        </label>

        <input
          id="wallet"
          type="text"
          placeholder="0x..."
          autocomplete="off"
        >

      </div>


      <!-- Register -->

      <button
        id="registerBtn"
        class="register-button"
        type="button"
      >
        REGISTER
      </button>


      <div
        id="formMessage"
        class="form-message"
        aria-live="polite"
      ></div>

    </section>


    <!-- =========================================
         SELECTED PERSONALITY
    ========================================== -->

    <section class="personality-card">

      <div class="personality-heading">
        SELECTED
      </div>

      <div class="personality-image-wrap">

        <img
          id="selectedPersonalityImage"
          src="/assets/goofy.jpg"
          alt="Selected personality"
        >

      </div>

      <div
        id="selectedPersonalityName"
        class="personality-name"
      >
        GOOFY
      </div>

      <button
        id="downloadCharacter"
        class="download-button"
        type="button"
      >
        DOWNLOAD
      </button>

    </section>


    <!-- =========================================
         MOSSURIS BOARD
    ========================================== -->

    <section class="leaderboard">

      <div class="leaderboard-header">

        <h2>
          MOSSURIS BOARD
        </h2>

        <div class="board-controls">

          <button
            id="boardPrev"
            type="button"
            aria-label="Previous board entries"
          >
            ‹
          </button>

          <button
            id="boardNext"
            type="button"
            aria-label="Next board entries"
          >
            ›
          </button>

        </div>

      </div>


      <div class="board-table">

        <div class="board-row board-head">

          <div>
            USERNAME
          </div>

          <div>
            WALLET
          </div>

          <div>
            PERSONALITY
          </div>

        </div>


        <div
          id="boardBody"
          class="board-body"
        >

          <div class="board-empty">
            No applications yet.
          </div>

        </div>

      </div>

    </section>


    <!-- =========================================
         SUCCESS POPUP
    ========================================== -->

    <div
      id="successModal"
      class="modal hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="successTitle"
    >

      <div class="modal-backdrop"></div>

      <div class="modal-card">

        <button
          id="closeModal"
          class="modal-close"
          type="button"
          aria-label="Close"
        >
          ×
        </button>

        <img
          id="successImage"
          src="/assets/success-popup.png"
          alt="Application successful"
        >

        <h2 id="successTitle">
          Application received
        </h2>

        <p>
          You're on the list!
        </p>

      </div>

    </div>

  </main>


  <script src="/script.js"></script>

</body>
</html>
